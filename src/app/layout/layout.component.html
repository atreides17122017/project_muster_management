<!-- LOGIN PAGE -->
<div *ngIf="router.url === '/login'">

  <router-outlet></router-outlet>

</div>

<!-- ALL OTHER PAGES -->
<div *ngIf="router.url !== '/login'">

  <!-- HEADER -->
  <header class="header">
    <button (click)="toggleSidebar()">☰</button>
    <h2>Admin Dashboard</h2>
  </header>

  <!-- TICKER -->
  <div class="ticker-container">
    <div class="ticker-track">
      Important dates:
      (1) NDA submission is due from the 1st to the 5th of every month
      (2) Muster submission is due from the 11th to the 12th of every month
    </div>
  </div>

  <!-- MAIN LAYOUT -->
  <div class="container" [class.collapsed]="isCollapsed">

    <aside>

      <div class="menu" *ngFor="let menu of menus">

        <!-- SINGLE MENU -->
        <div
          *ngIf="!menu.items || menu.items.length === 0"
          class="menu-title single"
          (click)="navigate(menu)">

          {{ menu.title }}

        </div>

        <!-- DROPDOWN MENU -->
        <div *ngIf="menu.items && menu.items.length">

          <div class="menu-title" (click)="toggleMenu(menu)">

            <span>{{ menu.title }}</span>

            <span
              class="arrow"
              [class.open]="menu.open">

              ▼

            </span>

          </div>

          <div class="submenu" *ngIf="menu.open">

            <div
              *ngFor="let item of menu.items"
              class="submenu-item"
              (click)="navigate(item, $event)">

              {{ item.name }}

            </div>

          </div>

        </div>

      </div>

    </aside>

    <main>

      <router-outlet></router-outlet>

    </main>

  </div>

</div>
