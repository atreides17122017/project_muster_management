<!-- DASHBOARD -->
<div *ngIf="isDashboard" class="dashboard">

  <h1 class="main-title">Muster Management System</h1>

  <div class="cards">
    <div class="card">Employees</div>
    <div class="card">Bill Units</div>
    <div class="card">Stations</div>
    <div class="card">Departments</div>
    <div class="card">Input Options</div>
  </div>

</div>

<!-- TABLE PAGE -->
<div *ngIf="!isDashboard" class="page">

  <div class="page-header">
    <h2>{{ title }}</h2>

    <button class="add-btn" (click)="addItem()">
      + Add
    </button>
  </div>

  <div class="search-bar">
    <input
      type="text"
      placeholder="Search..."
      [(ngModel)]="searchText"
    />
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th *ngFor="let col of columns">{{ col.label }}</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of data">
          <td *ngFor="let col of columns">
            {{ item[col.key] }}
          </td>

          <td class="actions">
            <button (click)="edit(item)">✏️</button>
            <button (click)="delete(item)">🗑️</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<!--ADD MODAL-->
<div *ngIf="showAddModal" class="modal-backdrop">
  <div class="modal-box">
    <h2>Add {{ title }}</h2>

    <div *ngFor="let col of columns">
      <label *ngIf="col.key !== 'id'">{{ col.label }}</label>

      <input
        *ngIf="col.key !== 'id'"
        [(ngModel)]="newItem[col.key]"
      />
    </div>

    <div class="modal-actions">
      <button (click)="saveNewItem()">Save</button>
      <button (click)="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!--EDIT MODAL-->
<div *ngIf="showEditModal" class="modal-backdrop">
  <div class="modal-box">
    <h2>Edit {{ title }}</h2>

    <div *ngFor="let col of columns">
      <label *ngIf="col.key !== 'id'">{{ col.label }}</label>

      <input
        *ngIf="col.key !== 'id'"
        [(ngModel)]="selectedItem[col.key]"
      />
    </div>

    <div class="modal-actions">
      <button (click)="updateItem()">Update</button>
      <button (click)="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!--DELETE MODAL-->
<div *ngIf="showDeleteModal" class="modal-backdrop">
  <div class="modal-box">
    <h3>Are you sure you want to delete?</h3>

    <div class="modal-actions">
      <button (click)="confirmDelete()">Yes</button>
      <button (click)="closeModal()">No</button>
    </div>
  </div>
</div>
